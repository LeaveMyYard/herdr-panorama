[project]
name = "herdr-panorama"
version = "0.1.1"
description = "Live swarm view of Claude Code orchestrators, threads and subagents in herdr"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "textual>=8.2,<8.3",  # tui.py patches Textual 8.2's partial-update crop (verified range)
]

[project.scripts]
panorama = "herdr_panorama.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_panorama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
