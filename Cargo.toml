# Rust workspace of herdr-panorama (plan: docs/plans/rust-rewrite.md §2.2).
#
# During the migration it sits beside the Python package: `crates/` and
# `src/main.rs` do not collide with `src/herdr_panorama/`. The Python code is
# deleted at cutover (§5.3, P8).
#
# The shared kit (https://github.com/LeaveMyYard/herdr-agent-kit) is a git
# dependency pinned by tag ([workspace.dependencies] below). Keep it on one line:
# .github/workflows/kit-bump.yml bumps it there.

[workspace]
members = ["crates/panorama-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV, the same as herdr-agent-kit's. It equals the toolchain pinned in
# rust-toolchain.toml; bump both together.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/LeaveMyYard/herdr-panorama"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
panorama-core = { path = "crates/panorama-core" }
herdr-agent-kit = { git = "https://github.com/LeaveMyYard/herdr-agent-kit", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The `panorama` binary: one binary, subcommands keep today's CLI names (§2.2).
# Its version is the Rust binary's own; pyproject.toml versions the Python
# package until cutover.
[package]
name = "panorama"
description = "Live swarm view of Claude Code orchestrators, threads and subagents in herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary's modules as a library, so its integration tests in tests/
# reach them.
[lib]
name = "panorama"
path = "src/lib.rs"

[[bin]]
name = "panorama"
path = "src/main.rs"

[dependencies]
# `internal`: panorama's own ids and state layout.
herdr-agent-kit = { workspace = true, features = ["internal"] }
panorama-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The interactive processes run one current_thread runtime (plan §2.5).
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal", "process"] }
# The terminal (plan §2.6, D5): ratatui's diffing buffer over crossterm, with its
# event stream for keys, mouse, focus and resizes.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
# Whether the terminal hung up (a poll; crossterm spins instead of reporting it); a timed-out
# rsync's process group killed (machines).
rustix = { version = "1", features = ["event", "process"] }
# A character's width in cells (a notice folds its text by it), as ratatui counts it.
unicode-width = "0.2"
# The local time zone's offset, for clock times.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# FakeHerdr, a scripted herdr socket, for the effects' tests.
herdr-agent-kit = { workspace = true, features = ["internal", "test-support"] }
tempfile = "3"
# A pseudo-terminal for the panel's hang-up test (safe calls: the crate forbids unsafe).
rustix = { version = "1", features = ["event", "process", "pty", "termios", "fs"] }

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
