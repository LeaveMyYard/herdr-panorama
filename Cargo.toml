# Rust workspace of herdr-panorama (plan: docs/plans/rust-rewrite.md §2.2).
#
# During the migration it sits beside the Python package: `crates/` and
# `src/main.rs` do not collide with `src/herdr_panorama/`. The Python code is
# deleted at cutover (§5.3, P8).
#
# The shared kit (https://github.com/LeaveMyYard/herdr-agent-kit) is a git
# dependency pinned by tag ([workspace.dependencies] below). Keep it on one line:
# .github/workflows/kit-bump.yml bumps it there.

[workspace]
members = ["crates/panorama-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV, the same as herdr-agent-kit's. It equals the toolchain pinned in
# rust-toolchain.toml; bump both together.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/LeaveMyYard/herdr-panorama"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
panorama-core = { path = "crates/panorama-core" }
herdr-agent-kit = { git = "https://github.com/LeaveMyYard/herdr-agent-kit", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The `panorama` binary: one binary, subcommands keep today's CLI names (§2.2).
# Its version is the Rust binary's own; pyproject.toml versions the Python
# package until cutover.
[package]
name = "panorama"
description = "Live swarm view of Claude Code orchestrators, threads and subagents in herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary's modules (proto, and the panel from P3) as a library, so its
# integration tests in tests/ reach them.
[lib]
name = "panorama"
path = "src/lib.rs"

[[bin]]
name = "panorama"
path = "src/main.rs"

[dependencies]
# `internal`: panorama's own state layout (the core socket's path).
herdr-agent-kit = { workspace = true, features = ["internal"] }
panorama-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The interactive processes run one current_thread runtime (plan §2.5).
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
