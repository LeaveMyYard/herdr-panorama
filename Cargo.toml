# Rust workspace of herdr-panorama (plan: docs/plans/rust-rewrite.md §2.2).
#
# During the migration it sits beside the Python package: `crates/` and
# `src/main.rs` do not collide with `src/herdr_panorama/`. The Python code is
# deleted at cutover (§5.3, P8).
#
# The shared kit (https://github.com/LeaveMyYard/herdr-agent-kit) joins as a git
# dependency pinned by tag once its first tag exists, in this form (one line, so
# .github/workflows/kit-bump.yml can bump it):
#
#   herdr-agent-kit = { git = "https://github.com/LeaveMyYard/herdr-agent-kit", tag = "vX.Y.Z" }

[workspace]
members = ["crates/panorama-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV, the same as herdr-agent-kit's. It equals the toolchain pinned in
# rust-toolchain.toml; bump both together.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/LeaveMyYard/herdr-panorama"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
panorama-core = { path = "crates/panorama-core" }

# The `panorama` binary: one binary, subcommands keep today's CLI names (§2.2).
[package]
name = "panorama"
description = "Live swarm view of Claude Code orchestrators, threads and subagents in herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "panorama"
path = "src/main.rs"

[dependencies]

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
