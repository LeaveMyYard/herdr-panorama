id = "leavemyyard.herdr-panorama"
name = "herdr panorama"
version = "0.1.1"
min_herdr_version = "0.9.0"
description = "Read-only swarm view: Claude Code orchestrators, the threads they drive and the subagents they spawned."
platforms = ["linux", "macos"]

# `herdr plugin install` runs this once in the install directory.
[[build]]
command = ["uv", "sync", "--frozen", "--no-dev"]

# The view. Full-screen popup (design 2a, 160x45 layout); session-modal, the
# tiled layout is left alone. The project is resolved from HERDR_PLUGIN_ROOT
# because a pane's cwd is not documented to be the plugin dir.
# scripts/tui runs the Rust app when this root has it built and it speaks the view contract
# (`panorama contract tui`), else the venv's, else uv run (docs/DESIGN.md).
[[panes]]
id = "panorama"
title = "Panorama"
placement = "popup"
width = "100%"
height = "100%"
command = ["sh", "-c", "exec sh \"${HERDR_PLUGIN_ROOT:-.}/scripts/tui\" tui"]

# The + New agent form as its own popup, over everything: a docked panel (46 columns) is too
# narrow for it. Sized for the form (76 columns plus its frame). PANORAMA_NEW_AGENT_CWD is the
# form's default working directory.
[[panes]]
id = "new-agent"
title = "New agent"
placement = "popup"
width = 84
height = 30
command = ["sh", "-c", "exec sh \"${HERDR_PLUGIN_ROOT:-.}/scripts/tui\" new-agent"]

# A per-tab panel (cockpit = true): this tab's docked panel, drawn from the core's
# state (the home panorama). Opened by the core as a split beside an orchestrator's pane.
# scripts/panel picks the viewer: the Rust one when this root has it built (its own
# target/release, never CARGO_TARGET_DIR) and it speaks this checkout's panel contract
# (`panorama contract`), else the venv's (no uv parent per panel), else uv run.
[[panes]]
id = "panel"
title = "Panorama panel"
placement = "split"
command = ["sh", "-c", "exec sh \"${HERDR_PLUGIN_ROOT:-.}/scripts/panel\""]

# Bind a key to this (suggested: prefix+space). With the home tab on (default), it focuses
# the "◆ panorama" tab, opening it if missing; with home_tab = false it opens the popup.
[[actions]]
id = "open"
title = "Panorama: open"
description = "Focus the panorama home tab (or open the popup when the home tab is off)."
command = ["sh", "-c", "exec sh \"${HERDR_PLUGIN_ROOT:-.}/scripts/tui\" open"]

[[actions]]
id = "open-popup"
title = "Panorama: open as a popup"
description = "Open the swarm view as a full-screen popup."
command = ["sh", "-c", "exec sh \"${HERDR_PLUGIN_ROOT:-.}/scripts/tui\" open --popup"]

# The design's side split (about 70 columns).
[[actions]]
id = "open-split"
title = "Panorama: open in a side split"
description = "Open the swarm view in a split to the right of the focused pane."
command = ["sh", "-c", "exec sh \"${HERDR_PLUGIN_ROOT:-.}/scripts/tui\" open --split"]

# Open the home tab once when herdr starts (never a second one; home_tab = false turns it off).
[[startup]]
command = ["sh", "-c", "exec sh \"${HERDR_PLUGIN_ROOT:-.}/scripts/tui\" home --startup"]
