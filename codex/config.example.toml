# The optional report_thread MCP server is gone: threads were removed, so there is
# nothing to report. If you merged a [mcp_servers.herdr_panorama] block from an
# earlier version of this file, delete it; until then `panorama mcp` keeps answering
# (its tool does nothing) so Codex never fails on it.

# hooks.json is a separate opt-in artifact; review/trust it with /hooks.
# Automatic pane binding requires `codex --no-daemon` and verified foreground
# process ownership. Shared-daemon sessions require explicit binding:
# panorama codex-bind THREAD_ID --pane PANE_ID
# The binding is Panorama-local; herdr's native resume/lifecycle state is untouched.
# After switching roots within the same TUI process, run the explicit bind again.
# Automatic conflicting-root hooks suppress old details until explicit rebinding.
